/* Fase 2: emitente, espelho de nota, aprovação do cliente e registro da nota fiscal. */
R.SIT_ESPELHO = {
  rascunho: ['Espelho desatualizado', 'alerta-selo'], aguardando: ['Aguardando aprovação', 'alerta-selo'],
  aprovado: ['Aprovado – falta a nota', ''], recusado: ['Recusado pelo cliente', 'erro-selo'], emitida: ['Nota fiscal registrada', 'ok-selo']
};
R.MEIOS = [['impresso', 'Espelho impresso e assinado'], ['whatsapp', 'WhatsApp'], ['email', 'E-mail'], ['pessoalmente', 'Pessoalmente'], ['telefone', 'Telefone'], ['outro', 'Outro']];
R.seloEspelho = function (e) {
  var s = R.SIT_ESPELHO[e.situacao] || [e.situacao, ''];
  return '<span class="selo ' + s[1] + '">' + (e.situacao === 'emitida' ? 'NF ' + e.nfNumero + ' série ' + e.nfSerie : s[0]) + '</span>';
};
R.agoraLocal = function () {
  var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
};
R.fmtDataHora = function (s) { return s ? R.fmtData(s.slice(0, 10)) + ' ' + s.slice(11, 16) : ''; };
R.fmtCep = function (c) { return c ? String(c).replace(/(\d{5})(\d{3})/, '$1-$2') : ''; };

// ---------- Emitente (aba em Cadastros) ----------
R.telas.formEmitente = function () {
  var m = R.cad.emitente || {}, contador = R.usuario.perfil === 'contador';
  R.abaCadastro = 'emitente';
  R.pintar('<h1>Cadastros</h1>' + R.segCadastros('emitente') + '<h2>Dados do emitente</h2><p class="muted">Aparecem no espelho de nota como quem vende.</p>' +
    '<div class="card"><dl class="dados"><dt>Nome</dt><dd>' + R.esc(m.nome) + '</dd><dt>CPF/CNPJ</dt><dd>' + R.esc(R.fmtDoc(m.documento)) + '</dd>' +
    '<dt>Inscrição estadual</dt><dd>' + (m.inscricaoEstadual ? R.esc(m.inscricaoEstadual) : '<b class="txt-aviso">Não informada</b>') + '</dd>' +
    '<dt>Município</dt><dd>' + R.esc(m.municipio + '/' + m.uf) + '</dd></dl>' +
    '<p class="muted" style="margin-bottom:0">' + (contador ? 'Para mudar estes dados, use Escritório > Empresas.' : 'Estes dados são alterados pelo escritório de contabilidade.') + '</p></div>' +
    '<form class="card" data-form="emitente" novalidate><div class="msg" hidden></div>' +
    R.campo('logradouro', 'Endereço (rua, estrada, sítio, fazenda)', m.logradouro, 'maxlength="120"') +
    '<div class="grade2">' + R.campo('numero', 'Número (ou S/N)', m.numero, 'maxlength="20"') + R.campo('bairro', 'Bairro ou localidade', m.bairro, 'maxlength="80"') + '</div>' +
    '<div class="grade2">' + R.campo('cep', 'CEP', R.fmtCep(m.cep), 'inputmode="numeric" maxlength="9"') + R.campo('telefone', 'Telefone', m.telefone, 'inputmode="tel" maxlength="30"') + '</div>' +
    R.campo('email', 'E-mail', m.email, 'type="email" inputmode="email"') +
    '<div class="botoes"><button class="btn primario">Salvar</button></div></form>');
};

R.forms.emitente = function (d, form) {
  d.empresaId = R.empresa.id;
  return R.exec('salvarEmitente', d).then(function (r) {
    R.cad.emitente = r.emitente;
    R.toast('Dados do emitente salvos.');
    if (R.voltarParaEspelho) { var lid = R.voltarParaEspelho; R.voltarParaEspelho = null; return R.gerarEspelho(lid); }
    R.ir('cadastros');
  });
};

// ---------- Pendências ----------
R.telas.notas = function () {
  return R.lerComCache('notas:' + R.empresa.id, 'listarNotas', { empresaId: R.empresa.id }, function (r) {
    var p = r.pendentes, grupos = [
      ['Sem espelho ainda', p.filter(function (x) { return !x.espelho; })],
      ['Espelho desatualizado (a venda mudou)', p.filter(function (x) { return x.espelho && x.espelho.situacao === 'rascunho'; })],
      ['Aguardando aprovação do cliente', p.filter(function (x) { return x.espelho && x.espelho.situacao === 'aguardando'; })],
      ['Recusados pelo cliente', p.filter(function (x) { return x.espelho && x.espelho.situacao === 'recusado'; })],
      ['Aprovados – falta registrar a nota', p.filter(function (x) { return x.espelho && x.espelho.situacao === 'aprovado'; })]
    ];
    var html = '<div class="titulo-linha"><h1>Notas e espelhos</h1></div>' +
      '<p class="muted">Vendas para clientes cadastrados só entram no faturamento depois que a nota fiscal é registrada.</p>';
    var algum = false;
    grupos.forEach(function (g) {
      if (!g[1].length) return;
      algum = true;
      html += '<h2 class="grupo">' + g[0] + ' <span class="cont">' + g[1].length + '</span></h2>' + g[1].map(R.cartaoNota).join('');
    });
    if (!algum) html += '<div class="card"><p class="muted">Nenhuma venda aguardando nota fiscal.</p></div>';
    if (r.emitidas.length) html += '<h2 class="grupo">Notas registradas recentemente</h2>' + r.emitidas.map(R.cartaoNota).join('');
    R.pintar(html);
  });
};

R.cartaoNota = function (x) {
  var acao = x.espelho ? 'data-act="abrirEspelho" data-id="' + R.esc(x.espelho.id) + '"' : 'data-act="gerarEspelho" data-lanc="' + R.esc(x.id) + '"';
  return '<button class="item" ' + acao + '><div class="lanc-linha"><b>' + R.esc(x.pessoaNome) + '</b><b class="valor">' + R.fmtR(x.total) + '</b></div>' +
    '<small>Venda de ' + R.fmtData(x.data) + (x.espelho ? ' · espelho nº ' + x.espelho.numero + (x.espelho.versao > 1 ? ' (versão ' + x.espelho.versao + ')' : '') : '') + '</small>' +
    (x.espelho ? R.seloEspelho(x.espelho) : '<span class="selo">Toque para gerar o espelho</span>') + '</button>';
};

R.acoes.irNotas = function () { R.ir('notas'); };
R.acoes.abrirEspelho = function (el) { return R.abrirEspelho(el.dataset.id); };
R.acoes.gerarEspelho = function (el) { return R.gerarEspelho(el.dataset.lanc); };

R.abrirEspelho = function (id) {
  return R.exec('abrirEspelho', { empresaId: R.empresa.id, espelhoId: id }).then(function (r) { R.ir('espelho', r); });
};

R.gerarEspelho = function (lancId) {
  return R.exec('gerarEspelho', { empresaId: R.empresa.id, lancamentoId: lancId }).then(function (r) {
    R.toast('Espelho gerado.');
    R.ir('espelho', { espelho: r.espelho, anteriores: [] });
  }, function (e) {
    if (e.tratado) throw e;
    // Leva direto ao cadastro que falta completar
    if (/dados do emitente/.test(e.message)) {
      R.toast(e.message, true); R.voltarParaEspelho = lancId; R.ir('formEmitente'); e.tratado = true;
    } else if (/cadastro do cliente/.test(e.message)) {
      var l = R.porId(R.lancs || [], lancId), cli = l ? R.porId(R.cad.clientes, l.pessoaId) : null;
      R.toast(e.message, true);
      if (cli) { R.retorno = { campo: 'espelho', lancId: lancId }; R.ir('formCliente', cli); }
      e.tratado = true;
    }
    throw e;
  });
};

// ---------- Documento do espelho ----------
R.blocoPessoa = function (titulo, p) {
  return '<div class="doc-bloco"><h4>' + titulo + '</h4><b>' + R.esc(p.nome) + '</b><br>' +
    'CPF/CNPJ: ' + R.esc(R.fmtDoc(p.documento)) + (p.inscricaoEstadual ? ' · IE: ' + R.esc(p.inscricaoEstadual) : '') + '<br>' +
    R.esc(p.logradouro + ', ' + p.numero + ' – ' + p.bairro) + '<br>' + R.esc(p.municipio + '/' + p.uf + ' · CEP ' + R.fmtCep(p.cep)) +
    (p.telefone ? '<br>Tel.: ' + R.esc(p.telefone) : '') + '</div>';
};

R.docEspelho = function (e) {
  var d = JSON.parse(e.dados);
  return '<article class="doc-espelho"><div class="doc-marca">ESPELHO – SEM VALOR FISCAL</div>' +
    '<div class="doc-topo"><div><b>Espelho de nota nº ' + e.numero + '</b>' + (e.versao > 1 ? ' (versão ' + e.versao + ')' : '') + '</div><div>Venda de ' + R.fmtData(d.data) + '</div></div>' +
    '<div class="doc-pessoas">' + R.blocoPessoa('Emitente', d.emitente) + R.blocoPessoa('Destinatário', d.destinatario) + '</div>' +
    '<table class="doc-itens"><thead><tr><th>Produto</th><th>NCM</th><th>CFOP</th><th>Un.</th><th>Qtd.</th><th>Valor unit.</th><th>Total</th></tr></thead><tbody>' +
    d.itens.map(function (i) {
      return '<tr><td>' + R.esc(i.nome) + '</td><td>' + R.esc(R.fmtNcm(i.ncm)) + '</td><td>' + R.esc(i.cfop) + '</td><td>' + R.esc(i.unidade) + '</td><td>' + R.fmtNum(i.quantidade) +
        '</td><td>' + R.fmtR(Math.round(i.valorUnitario * 100)) + '</td><td>' + R.fmtR(i.valorTotal) + '</td></tr>';
    }).join('') + '</tbody></table>' +
    '<table class="doc-totais"><tr><td>Total dos produtos</td><td>' + R.fmtR(d.valorItens) + '</td></tr>' +
    (d.frete ? '<tr><td>Frete</td><td>' + R.fmtR(d.frete) + '</td></tr>' : '') + (d.acrescimos ? '<tr><td>Outras despesas</td><td>' + R.fmtR(d.acrescimos) + '</td></tr>' : '') +
    (d.desconto ? '<tr><td>Desconto</td><td>− ' + R.fmtR(d.desconto) + '</td></tr>' : '') + '<tr class="forte"><td>Valor total da nota</td><td>' + R.fmtR(d.total) + '</td></tr></table>' +
    '<div class="doc-bloco"><h4>Pagamento</h4>' + R.esc(R.rotulo(R.FORMAS, d.formaPagamento)) + ' · ' + (d.condicao === 'prazo' ? 'a prazo' : 'à vista') +
    (d.parcelas.length ? '<br>' + d.parcelas.map(function (p) { return p.numero + 'ª: ' + R.fmtData(p.vencimento) + ' – ' + R.fmtR(p.valor); }).join('<br>') : '') + '</div>' +
    (d.observacao ? '<div class="doc-bloco"><h4>Observação</h4>' + R.esc(d.observacao) + '</div>' : '') +
    '<div class="doc-assinatura"><div>Conferido e aprovado por: ______________________________</div><div>Data: ____/____/______ &nbsp; Assinatura: ______________________</div></div>' +
    '<p class="doc-rodape">Documento para conferência antes da emissão da nota fiscal. Não substitui a nota fiscal.</p></article>';
};

// ---------- Tela do espelho ----------
R.telas.espelho = function (r) {
  var e = r.espelho;
  R.espAtual = r;
  var acoes = '';
  if (e.situacao === 'aguardando') {
    acoes = '<div class="botoes"><button class="btn" data-act="imprimirEspelho">Imprimir ou salvar PDF</button><button class="btn" data-act="whatsEspelho">Enviar pelo WhatsApp</button></div>' +
      '<div class="botoes"><button class="btn primario" data-act="irAprovacao">Registrar aprovação</button><button class="btn perigo" data-act="irRecusa">Registrar recusa</button></div>';
  } else if (e.situacao === 'aprovado') {
    acoes = '<div class="alerta ok">Aprovado por ' + R.esc(e.aprovadoPor) + ' em ' + R.fmtDataHora(e.aprovadoEm) + ' (' + R.esc(R.rotulo(R.MEIOS, e.aprovadoMeio)) + '). Agora emita a nota fiscal e registre os dados dela aqui.</div>' +
      '<div class="botoes"><button class="btn primario" data-act="irNota">Registrar nota fiscal</button><button class="btn" data-act="imprimirEspelho">Imprimir</button></div>';
  } else if (e.situacao === 'recusado') {
    acoes = '<div class="alerta erro"><b>Recusado pelo cliente:</b> ' + R.esc(e.recusaMotivo) + '</div>' +
      '<p class="muted">Corrija a venda e gere o espelho de novo.</p><div class="botoes"><button class="btn primario" data-act="editarVendaEspelho">Corrigir a venda</button>' +
      '<button class="btn" data-act="gerarEspelho" data-lanc="' + R.esc(e.lancamentoId) + '">Gerar espelho de novo</button></div>';
  } else if (e.situacao === 'rascunho') {
    acoes = '<div class="alerta aviso">A venda foi alterada depois deste espelho. Gere o espelho atualizado e peça uma nova aprovação ao cliente.</div>' +
      '<div class="botoes"><button class="btn primario" data-act="gerarEspelho" data-lanc="' + R.esc(e.lancamentoId) + '">Gerar espelho atualizado</button></div>';
  } else if (e.situacao === 'emitida') {
    acoes = '<div class="alerta ok"><b>Nota fiscal registrada:</b> nº ' + e.nfNumero + ', série ' + e.nfSerie + ', emitida em ' + R.fmtData(e.nfData) +
      (e.nfChave ? '<br><small>Chave: ' + R.esc(e.nfChave.replace(/(\d{4})/g, '$1 ')) + '</small>' : '') + '<br>A venda já entrou no faturamento.</div>' +
      '<div class="botoes"><button class="btn" data-act="imprimirEspelho">Imprimir espelho</button>' +
      (R.usuario.perfil === 'contador' ? '<button class="btn perigo" data-act="cancelarNota">Cancelar registro da nota</button>' : '') + '</div>' +
      (R.usuario.perfil === 'contador' ? '<p class="muted">"Cancelar registro da nota" é visível só para o contador.</p>' : '<p class="muted">Se algum dado da nota estiver errado, fale com o escritório de contabilidade.</p>');
  }
  // Só o contador (usuário mestre) pode voltar uma aprovação ou recusa para "aguardando aprovação".
  if (R.usuario.perfil === 'contador' && (e.situacao === 'aprovado' || e.situacao === 'recusado')) {
    acoes += '<div class="botoes"><button class="btn perigo" data-act="desfazerDecisao">' + (e.situacao === 'aprovado' ? 'Desfazer aprovação' : 'Desfazer recusa') + '</button></div>' +
      '<p class="muted">Visível só para o contador. O espelho volta para "Aguardando aprovação" e a mudança fica registrada.</p>';
  }
  var hist = (r.anteriores || []).length ? '<details class="card"><summary>Versões anteriores (' + r.anteriores.length + ')</summary><ul class="proximos">' +
    r.anteriores.map(function (a) {
      return '<li>Versão ' + a.versao + ' – gerada em ' + R.fmtDataHora(a.criadoEm.slice(0, 16)) + (a.aprovadoPor ? ' · aprovada por ' + R.esc(a.aprovadoPor) : '') +
        (a.recusaMotivo ? ' · recusada: ' + R.esc(a.recusaMotivo) : '') + '</li>';
    }).join('') + '</ul></details>' : '';
  R.pintar('<div class="titulo-linha nao-imprimir"><h1>Espelho nº ' + e.numero + '</h1>' + R.seloEspelho(e) + '</div>' +
    '<div class="nao-imprimir">' + acoes + '</div>' + R.docEspelho(e) + '<div class="nao-imprimir">' + hist +
    '<div class="botoes"><button class="btn" data-act="irNotas">Voltar para notas</button></div></div>');
};

R.acoes.imprimirEspelho = function () { window.print(); };

R.textoWhats = function (e) {
  var d = JSON.parse(e.dados);
  var t = 'ESPELHO DE NOTA Nº ' + e.numero + ' – SEM VALOR FISCAL\n\n' + d.emitente.nome + ' → ' + d.destinatario.nome + '\nVenda de ' + R.fmtData(d.data) + '\n\n' +
    d.itens.map(function (i) { return '• ' + i.nome + ': ' + R.fmtNum(i.quantidade) + ' ' + i.unidade + ' × ' + R.fmtR(Math.round(i.valorUnitario * 100)) + ' = ' + R.fmtR(i.valorTotal); }).join('\n') +
    (d.frete ? '\nFrete: ' + R.fmtR(d.frete) : '') + (d.acrescimos ? '\nOutras despesas: ' + R.fmtR(d.acrescimos) : '') + (d.desconto ? '\nDesconto: −' + R.fmtR(d.desconto) : '') +
    '\n*Total: ' + R.fmtR(d.total) + '*\n\nPagamento: ' + R.rotulo(R.FORMAS, d.formaPagamento) + (d.condicao === 'prazo' ? ' a prazo' : ' à vista') +
    (d.parcelas.length ? '\n' + d.parcelas.map(function (p) { return p.numero + 'ª parcela: ' + R.fmtData(p.vencimento) + ' – ' + R.fmtR(p.valor); }).join('\n') : '') +
    '\n\nPor favor, confira e responda se está tudo certo para emitirmos a nota fiscal.';
  return t;
};

R.acoes.whatsEspelho = function () {
  var e = R.espAtual.espelho, d = JSON.parse(e.dados), tel = R.digitos(d.destinatario.telefone);
  if (tel.length === 10 || tel.length === 11) tel = '55' + tel;
  else if (!(tel.length >= 12 && tel.indexOf('55') === 0)) tel = '';
  window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(R.textoWhats(e)), '_blank', 'noopener');
};
R.digitos = function (v) { return String(v || '').replace(/\D/g, ''); };

R.acoes.editarVendaEspelho = function () {
  var lid = R.espAtual.espelho.lancamentoId, l = R.porId(R.lancs || [], lid);
  var abrir = function (lanc) { R.ir('lancar', { editar: lanc }); };
  if (l) return abrir(l);
  // a venda pode ser de outro mês: busca pelo mês da data do espelho
  var mes = JSON.parse(R.espAtual.espelho.dados).data.slice(0, 7);
  return R.carregarMes(mes).then(function (lancs) { var x = R.porId(lancs, lid); if (x) abrir(x); else R.toast('Venda não encontrada.', true); });
};

R.acoes.desfazerDecisao = function () {
  var aprovado = R.espAtual.espelho.situacao === 'aprovado';
  if (!confirm(aprovado ? 'Desfazer a aprovação? O espelho volta para "Aguardando aprovação" e a nota só poderá ser registrada depois de uma nova aprovação.'
    : 'Desfazer a recusa? O espelho volta para "Aguardando aprovação".')) return;
  return R.exec('desfazerDecisao', { empresaId: R.empresa.id, espelhoId: R.espAtual.espelho.id }).then(function () {
    R.toast(aprovado ? 'Aprovação desfeita.' : 'Recusa desfeita.');
    return R.abrirEspelho(R.espAtual.espelho.id);
  });
};

R.acoes.cancelarNota = function () {
  if (!confirm('Cancelar o registro desta nota fiscal? A venda sai do faturamento e volta a aguardar a nota. Use só para corrigir um registro errado.')) return;
  return R.exec('cancelarNota', { empresaId: R.empresa.id, espelhoId: R.espAtual.espelho.id }).then(function () {
    R.toast('Registro da nota cancelado.');
    return R.abrirEspelho(R.espAtual.espelho.id);
  });
};

// ---------- Aprovação, recusa e nota ----------
R.acoes.irAprovacao = function () { R.ir('formAprovacao'); };
R.acoes.irRecusa = function () { R.ir('formRecusa'); };
R.acoes.irNota = function () { R.ir('formNota'); };
R.acoes.voltarEspelho = function () { R.ir('espelho', R.espAtual); };

R.cabecalhoDecisao = function (titulo) {
  var e = R.espAtual.espelho, d = JSON.parse(e.dados);
  return '<h1>' + titulo + '</h1><div class="card"><b>Espelho nº ' + e.numero + '</b> · ' + R.esc(d.destinatario.nome) + ' · ' + R.fmtR(d.total) + '</div>';
};
R.botoesDecisao = function (rotulo) {
  return '<div class="botoes"><button type="button" class="btn" data-act="voltarEspelho">Cancelar</button><button class="btn primario">' + rotulo + '</button></div>';
};

R.telas.formAprovacao = function () {
  R.pintar(R.cabecalhoDecisao('Registrar aprovação') + '<form class="card" data-form="aprovacao" novalidate><div class="msg" hidden></div>' +
    R.campo('aprovadoPor', 'Quem aprovou (nome do cliente ou responsável)', '', 'required maxlength="120"') +
    '<div class="grade2"><label class="campo"><span>Data e hora da aprovação</span><input type="datetime-local" name="aprovadoEm" value="' + R.agoraLocal() + '"></label>' +
    '<label class="campo"><span>Como aprovou</span><select name="aprovadoMeio">' + R.opcoes(R.MEIOS, 'impresso') + '</select></label></div>' +
    R.botoesDecisao('Confirmar aprovação') + '</form>');
};
R.forms.aprovacao = function (d) {
  return R.exec('decidirEspelho', { empresaId: R.empresa.id, espelhoId: R.espAtual.espelho.id, aprovado: true, aprovadoPor: d.aprovadoPor, aprovadoEm: d.aprovadoEm, aprovadoMeio: d.aprovadoMeio })
    .then(function () { R.toast('Aprovação registrada.'); return R.abrirEspelho(R.espAtual.espelho.id); });
};

R.telas.formRecusa = function () {
  R.pintar(R.cabecalhoDecisao('Registrar recusa') + '<form class="card" data-form="recusa" novalidate><div class="msg" hidden></div>' +
    R.campo('recusaMotivo', 'O que o cliente pediu para mudar?', '', 'required maxlength="300"') + R.botoesDecisao('Registrar recusa') + '</form>');
};
R.forms.recusa = function (d) {
  return R.exec('decidirEspelho', { empresaId: R.empresa.id, espelhoId: R.espAtual.espelho.id, aprovado: false, recusaMotivo: d.recusaMotivo })
    .then(function () { R.toast('Recusa registrada.'); return R.abrirEspelho(R.espAtual.espelho.id); });
};

R.telas.formNota = function () {
  R.pintar(R.cabecalhoDecisao('Registrar nota fiscal') + '<form class="card" data-form="nota" novalidate><div class="msg" hidden></div>' +
    '<p class="muted" style="margin-top:0">Depois de emitir a nota no sistema da Sefaz (ou no talão de produtor), informe os dados dela. A venda entra no faturamento na data da nota.</p>' +
    '<div class="grade3">' + R.campo('numero', 'Número', '', 'inputmode="numeric" maxlength="9" required') + R.campo('serie', 'Série', '', 'inputmode="numeric" maxlength="3" required') +
    '<label class="campo"><span>Emitida em</span><input type="date" name="data" value="' + R.hoje() + '"></label></div>' +
    '<label class="campo"><span>Chave de acesso (44 números, se for NF-e)</span><input name="chave" inputmode="numeric" maxlength="60" placeholder="0000 0000 0000 ..."></label>' +
    R.botoesDecisao('Registrar nota') + '</form>');
};
R.forms.nota = function (d) {
  return R.exec('registrarNota', { empresaId: R.empresa.id, espelhoId: R.espAtual.espelho.id, numero: d.numero, serie: d.serie, data: d.data, chave: d.chave })
    .then(function () { R.toast('Nota fiscal registrada. A venda entrou no faturamento.'); return R.abrirEspelho(R.espAtual.espelho.id); });
};

/* Fase 3: contas a pagar e a receber, movimentos de caixa e fluxo de caixa. */
R.abaFin = 'pagar';
R.ABAS_FIN = [['pagar', 'A pagar'], ['receber', 'A receber'], ['caixa', 'Caixa e movimentos'], ['fluxo', 'Fluxo de caixa']];
R.segFin = function (aba) {
  return '<div class="seg" role="tablist">' + R.ABAS_FIN.map(function (a) {
    return '<button role="tab" data-act="abaFin" data-aba="' + a[0] + '" aria-selected="' + (a[0] === aba) + '"' + (a[0] === aba ? ' class="ativo"' : '') + '>' + a[1] + '</button>';
  }).join('') + '</div>';
};
R.acoes.abaFin = function (el) { R.abaFin = el.dataset.aba; R.ir('financeiro'); };
R.acoes.irFinanceiro = function (el) { if (el && el.dataset.aba) R.abaFin = el.dataset.aba; R.ir('financeiro'); };
R.contasAtivas = function () { return (R.cad.contas || []).filter(function (c) { return c.ativa; }); };
R.opcoesContas = function (atual, exceto) {
  return '<option value="">Selecione</option>' + R.contasAtivas().filter(function (c) { return c.id !== exceto; }).map(function (c) {
    return '<option value="' + R.esc(c.id) + '"' + (c.id === atual ? ' selected' : '') + '>' + R.esc(c.nome) + '</option>';
  }).join('');
};
R.diasEntre = function (a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); };

R.telas.financeiro = function () {
  if (R.abaFin === 'caixa') return R.telaCaixa();
  if (R.abaFin === 'fluxo') return R.telaFluxo();
  var aba = R.abaFin;
  return R.lerComCache('abertos:' + R.empresa.id, 'listarAbertos', { empresaId: R.empresa.id }, function (r) {
    R.abertos = r.parcelas;
    if (R.abaFin !== aba) return; // a pessoa já trocou de aba
    var tipo = R.abaFin === 'pagar' ? 'compra' : 'venda', hoje = R.hoje();
    var lista = r.parcelas.filter(function (p) { return p.tipo === tipo; });
    var grupos = [
      ['Vencidas', lista.filter(function (p) { return p.vencimento < hoje; }), 'vencida'],
      ['Vencem nos próximos 7 dias', lista.filter(function (p) { return p.vencimento >= hoje && R.diasEntre(hoje, p.vencimento) <= 7; }), ''],
      ['Mais adiante', lista.filter(function (p) { return R.diasEntre(hoje, p.vencimento) > 7; }), '']
    ];
    var total = lista.reduce(function (s, p) { return s + p.saldo; }, 0);
    var html = '<h1>Financeiro</h1>' + R.segFin(R.abaFin) +
      '<div class="cards"><div class="kpi"><span>Total ' + (tipo === 'compra' ? 'a pagar' : 'a receber') + '</span><b>' + R.fmtR(total) + '</b><small>' + lista.length + ' parcela(s)</small></div>' +
      '<div class="kpi' + (grupos[0][1].length ? ' alerta' : '') + '"><span>Vencido</span><b>' + R.fmtR(grupos[0][1].reduce(function (s, p) { return s + p.saldo; }, 0)) + '</b><small>' + grupos[0][1].length + ' parcela(s)</small></div></div>';
    if (!lista.length) html += '<div class="card"><p class="muted">Nada ' + (tipo === 'compra' ? 'a pagar' : 'a receber') + '. Compras e vendas a prazo aparecem aqui até serem quitadas.</p></div>';
    grupos.forEach(function (g) {
      if (!g[1].length) return;
      html += '<h2 class="grupo">' + g[0] + ' <span class="cont">' + g[1].length + '</span></h2>' + g[1].map(function (p) { return R.cartaoParcela(p, g[2]); }).join('');
    });
    R.pintar(html);
  });
};

R.cartaoParcela = function (p, classe) {
  var nome = p.pessoaNome || (p.tipo === 'venda' ? 'Consumidor não identificado' : 'Sem fornecedor');
  var itens = p.itemIds.map(function (id) { var it = R.porId(R.cad.itens, id); return it ? it.nome : ''; }).filter(String).join(', ');
  return '<button class="item parcela-item ' + (classe || '') + '" data-act="abrirParcela" data-id="' + R.esc(p.id) + '"><div class="lanc-linha"><b>' + R.esc(nome) + '</b><b class="valor">' + R.fmtR(p.saldo) + '</b></div>' +
    '<small>Parcela ' + p.numero + '/' + p.de + ' · vence ' + R.fmtData(p.vencimento) + ' · ' + R.esc(R.rotulo(R.FORMAS, p.formaPagamento)) + '</small>' +
    (itens ? '<small>' + R.esc(itens) + '</small>' : '') +
    (p.status === 'parcial' ? '<span class="selo">Pago em parte: ' + R.fmtR(p.pago) + ' de ' + R.fmtR(p.valor) + '</span>' : '') +
    (p.statusLancamento === 'aguardando_nota' ? '<span class="selo alerta-selo">Aguardando nota fiscal</span>' : '') + '</button>';
};

R.acoes.abrirParcela = function (el) { R.ir('formBaixa', R.porId(R.abertos, el.dataset.id)); };

// ---------- Baixa (pagamento ou recebimento) ----------
R.telas.formBaixa = function (p) {
  R.parcelaAtual = p;
  var compra = p.tipo === 'compra', caixa = R.contasAtivas()[0];
  var html = '<h1>' + (compra ? 'Registrar pagamento' : 'Registrar recebimento') + '</h1>' +
    '<div class="card destaque"><div class="lanc-linha"><b>' + R.esc(p.pessoaNome || (compra ? 'Sem fornecedor' : 'Consumidor não identificado')) + '</b><b>' + R.fmtR(p.saldo) + '</b></div>' +
    '<small class="muted">Parcela ' + p.numero + '/' + p.de + ' de ' + R.fmtR(p.valor) + ' · vence ' + R.fmtData(p.vencimento) + ' · ' + (compra ? 'compra' : 'venda') + ' de ' + R.fmtData(p.dataLancamento) + '</small>' +
    (p.baixas.length ? '<h3 style="margin-top:12px">Já registrado</h3><table class="tabela"><tbody>' + p.baixas.map(function (b) {
      var c = R.porId(R.cad.contas, b.contaFinanceiraId);
      return '<tr><td>' + R.fmtData(b.data) + '<br><small class="muted">' + R.esc(c ? c.nome : '') + (b.juros ? ' · juros ' + R.fmtR(b.juros) : '') + (b.desconto ? ' · desc. ' + R.fmtR(b.desconto) : '') + '</small></td>' +
        '<td>' + R.fmtR(b.valorPago) + '</td><td><button class="btn link" data-act="estornarBaixa" data-id="' + R.esc(b.id) + '">Estornar</button></td></tr>';
    }).join('') + '</tbody></table>' : '') + '</div>';
  if (p.statusLancamento === 'aguardando_nota') {
    html += '<div class="alerta aviso">Esta venda ainda aguarda a nota fiscal. Registre a nota em <b>Notas e espelhos</b> antes de dar baixa no recebimento.</div>' +
      '<div class="botoes"><button class="btn" data-act="irFinanceiro">Voltar</button><button class="btn primario" data-act="irNotas">Notas e espelhos</button></div>';
    R.pintar(html);
    return;
  }
  html += '<form class="card" data-form="baixa" id="formBaixa" novalidate><div class="msg" hidden></div>' +
    '<label class="campo"><span>Data do ' + (compra ? 'pagamento' : 'recebimento') + '</span><input type="date" name="data" value="' + R.hoje() + '" min="' + R.esc(R.empresa.dataInicio) + '"></label>' +
    '<label class="campo"><span>Valor da parcela que está sendo quitado</span><input name="principal" inputmode="decimal" value="' + R.centCampo(p.saldo) + '"><small>Para pagamento parcial, informe só a parte paga.</small></label>' +
    '<div class="grade2">' + R.campo('juros', 'Juros ou multa', '', 'inputmode="decimal" placeholder="0,00"') + R.campo('desconto', 'Desconto', '', 'inputmode="decimal" placeholder="0,00"') + '</div>' +
    '<div class="total-pago" id="totalPago"></div>' +
    '<label class="campo"><span>' + (compra ? 'Saiu de qual conta?' : 'Entrou em qual conta?') + '</span><select name="contaFinanceiraId">' + R.opcoesContas(caixa ? caixa.id : '') + '</select></label>' +
    R.campo('observacao', 'Observação (opcional)', '', 'maxlength="200"') +
    '<div class="botoes"><button type="button" class="btn" data-act="irFinanceiro">Cancelar</button><button class="btn primario">' + (compra ? 'Registrar pagamento' : 'Registrar recebimento') + '</button></div></form>';
  R.pintar(html);
  R.atualizarTotalPago();
};

R.atualizarTotalPago = function () {
  var f = R.el('formBaixa');
  if (!f) return;
  var pr = R.paraCentavos(f.principal.value), j = f.juros.value ? R.paraCentavos(f.juros.value) : 0, d = f.desconto.value ? R.paraCentavos(f.desconto.value) : 0;
  var ok = isFinite(pr) && isFinite(j) && isFinite(d);
  R.el('totalPago').innerHTML = ok ? 'Total ' + (R.parcelaAtual.tipo === 'compra' ? 'pago' : 'recebido') + ': <b>' + R.fmtR(pr + j - d) + '</b>' +
    (pr < R.parcelaAtual.saldo ? ' <span class="muted">(pagamento parcial: restam ' + R.fmtR(R.parcelaAtual.saldo - pr) + ')</span>' : '') : '<span class="txt-aviso">Confira os valores digitados.</span>';
};
document.addEventListener('input', function (ev) { if (ev.target.closest && ev.target.closest('#formBaixa')) R.atualizarTotalPago(); });

R.forms.baixa = function (d) {
  var principal = R.paraCentavos(d.principal), juros = d.juros ? R.paraCentavos(d.juros) : 0, desconto = d.desconto ? R.paraCentavos(d.desconto) : 0;
  if (![principal, juros, desconto].every(isFinite)) return Promise.reject(new Error('Confira os valores digitados.'));
  return R.exec('registrarBaixa', { empresaId: R.empresa.id, parcelaId: R.parcelaAtual.id, data: d.data, principal: principal, juros: juros, desconto: desconto,
    contaFinanceiraId: d.contaFinanceiraId, observacao: d.observacao }).then(function (r) {
    R.toast(r.status === 'paga' ? 'Parcela quitada.' : 'Pagamento parcial registrado.');
    R.ir('financeiro');
  });
};

R.acoes.estornarBaixa = function (el) {
  if (!confirm('Estornar este pagamento? Ele sai do caixa e a parcela volta a ficar em aberto.')) return;
  return R.exec('estornarBaixa', { empresaId: R.empresa.id, baixaId: el.dataset.id }).then(function () {
    R.toast('Pagamento estornado.');
    R.ir('financeiro');
  });
};

// ---------- Caixa e movimentos ----------
R.mesMov = '';
R.TIPOS_MOV = { aporte: 'Aporte do produtor', retirada: 'Retirada do produtor', transferencia: 'Transferência entre contas', fatura_cartao: 'Pagamento da fatura do cartão' };

R.telaCaixa = function () {
  if (!R.mesMov) R.mesMov = R.hoje().slice(0, 7);
  var mes = R.mesMov;
  return R.lerComCache('mov:' + R.empresa.id + ':' + mes, 'listarMovimentos', { empresaId: R.empresa.id, mes: mes }, function (r) {
    if (R.abaFin !== 'caixa' || R.mesMov !== mes) return;
    R.saldoCartao = r.saldoCartao;
    R.movs = r.movimentos;
    var html = '<h1>Financeiro</h1>' + R.segFin('caixa') +
      '<p class="muted">Dinheiro que entra ou sai sem ser compra ou venda. Retiradas para a família ficam separadas das despesas da propriedade.</p>' +
      '<div class="botoes"><button class="btn" data-act="novoMov" data-tipo="aporte">+ Aporte</button><button class="btn" data-act="novoMov" data-tipo="retirada">+ Retirada</button></div>' +
      '<div class="botoes"><button class="btn" data-act="novoMov" data-tipo="transferencia">Transferir entre contas</button>' +
      '<button class="btn" data-act="novoMov" data-tipo="fatura_cartao"' + (r.saldoCartao > 0 ? '' : ' disabled') + '>Pagar fatura do cartão</button></div>' +
      (r.saldoCartao > 0 ? '<div class="alerta aviso">Compras no cartão de crédito a pagar: <b>' + R.fmtR(r.saldoCartao) + '</b></div>' : '') +
      '<div class="mes-nav"><button class="btn" data-act="mesMov" data-d="-1" aria-label="Mês anterior">‹</button><b>' + R.nomeMes(R.mesMov) + '</b>' +
      '<button class="btn" data-act="mesMov" data-d="1" aria-label="Próximo mês">›</button></div>';
    html += r.movimentos.length ? r.movimentos.map(function (m) {
      var c = R.porId(R.cad.contas, m.contaFinanceiraId), dst = R.porId(R.cad.contas, m.contaDestinoId);
      var entra = m.tipo === 'aporte';
      return '<div class="item mov"><div class="lanc-linha"><b>' + R.esc(R.TIPOS_MOV[m.tipo]) + '</b><b class="valor">' + (m.tipo === 'transferencia' ? '' : entra ? '+ ' : '− ') + R.fmtR(m.valor) + '</b></div>' +
        '<small>' + R.fmtData(m.data) + ' · ' + R.esc(c ? c.nome : '') + (dst ? ' → ' + R.esc(dst.nome) : '') + (m.observacao ? ' · ' + R.esc(m.observacao) : '') + '</small>' +
        '<button class="btn link" data-act="excluirMov" data-id="' + R.esc(m.id) + '">Excluir</button></div>';
    }).join('') : '<div class="card"><p class="muted">Nenhum movimento neste mês.</p></div>';
    R.pintar(html);
  });
};

R.acoes.mesMov = function (el) {
  var p = R.mesMov.split('-').map(Number), d = new Date(p[0], p[1] - 1 + Number(el.dataset.d), 1);
  R.mesMov = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  R.ir('financeiro');
};
R.acoes.novoMov = function (el) { R.ir('formMovimento', { tipo: el.dataset.tipo }); };
R.acoes.excluirMov = function (el) {
  if (!confirm('Excluir este movimento?')) return;
  return R.exec('excluirMovimento', { empresaId: R.empresa.id, id: el.dataset.id }).then(function () { R.toast('Movimento excluído.'); R.ir('financeiro'); });
};

R.telas.formMovimento = function (d) {
  var t = d.tipo, caixa = R.contasAtivas()[0];
  var ajuda = {
    aporte: 'Dinheiro do produtor (ou da família) colocado na atividade.',
    retirada: 'Dinheiro da atividade usado pela família ou pelo produtor. Não entra como despesa da propriedade.',
    transferencia: 'Ex.: saque do banco para o caixa, ou depósito do caixa no banco.',
    fatura_cartao: 'Valor pago da fatura. Compras no cartão ainda a pagar: ' + R.fmtR(R.saldoCartao || 0) + '.'
  }[t];
  R.pintar('<h1>' + R.esc(R.TIPOS_MOV[t]) + '</h1><form class="card" data-form="movimento" novalidate><div class="msg" hidden></div>' +
    '<input type="hidden" name="tipo" value="' + R.esc(t) + '"><p class="muted" style="margin-top:0">' + R.esc(ajuda) + '</p>' +
    '<div class="grade2"><label class="campo"><span>Data</span><input type="date" name="data" value="' + R.hoje() + '" min="' + R.esc(R.empresa.dataInicio) + '"></label>' +
    R.campo('valor', 'Valor', t === 'fatura_cartao' ? R.centCampo(R.saldoCartao) : '', 'inputmode="decimal" placeholder="0,00"') + '</div>' +
    '<label class="campo"><span>' + ({ aporte: 'Entrou em qual conta?', retirada: 'Saiu de qual conta?', transferencia: 'De qual conta?', fatura_cartao: 'Pago com qual conta?' }[t]) + '</span>' +
    '<select name="contaFinanceiraId">' + R.opcoesContas(caixa ? caixa.id : '') + '</select></label>' +
    (t === 'transferencia' ? '<label class="campo"><span>Para qual conta?</span><select name="contaDestinoId">' + R.opcoesContas('') + '</select></label>' : '') +
    R.campo('observacao', 'Observação (opcional)', '', 'maxlength="200"') +
    '<div class="botoes"><button type="button" class="btn" data-act="irFinanceiro" data-aba="caixa">Cancelar</button><button class="btn primario">Salvar</button></div></form>');
};

R.forms.movimento = function (d) {
  var valor = R.paraCentavos(d.valor);
  if (!(valor > 0)) return Promise.reject(new Error('Informe o valor.'));
  d.valor = valor; d.empresaId = R.empresa.id;
  return R.exec('salvarMovimento', d).then(function (r) {
    R.toast('Movimento salvo.');
    R.mesMov = r.movimento.data.slice(0, 7);
    R.abaFin = 'caixa';
    R.ir('financeiro');
  });
};

// ---------- Fluxo de caixa ----------
R.fluxoCfg = { mes: '', escala: 'semana', conta: 'todas', previsto: true };
R.GRUPOS_FLUXO = [['operacional', 'Atividade (compras, vendas, despesas)'], ['investimento', 'Investimentos (máquinas, benfeitorias)'], ['produtor', 'Aportes e retiradas do produtor']];

R.telaFluxo = function () {
  if (!R.fluxoCfg.mes) R.fluxoCfg.mes = R.hoje().slice(0, 7);
  return R.lerComCache('fluxo:' + R.empresa.id, 'fluxoCaixa', { empresaId: R.empresa.id }, function (r) { R.fluxoDados = r; if (R.abaFin === 'fluxo') R.renderFluxo(); });
};

R.calcularFluxo = function () {
  var cfg = R.fluxoCfg, r = R.fluxoDados, ini = cfg.mes + '-01';
  var p = cfg.mes.split('-').map(Number), fim = new Date(Date.UTC(p[0], p[1], 0)).toISOString().slice(0, 10);
  var real = r.realizado.filter(function (x) { return cfg.conta === 'todas' ? x.grupo !== 'transferencia' : x.contaFinanceiraId === cfg.conta; });
  var prev = cfg.previsto && cfg.conta === 'todas' ? r.previsto : [];
  var hoje = R.hoje();
  var saldoInicial = real.filter(function (x) { return x.data < ini; }).reduce(function (s, x) { return s + x.valor; }, 0);
  var noPeriodo = function (x) { return x.data >= ini && x.data <= fim; };
  // parcelas vencidas e não pagas entram como previstas para hoje (se hoje estiver no mês)
  var prevAjustado = prev.map(function (x) { return x.data < hoje ? { data: hoje, valor: x.valor, historico: x.historico + ' (vencida)', grupo: x.grupo, aguardandoNota: x.aguardandoNota } : x; });
  var rp = real.filter(noPeriodo), pp = prevAjustado.filter(noPeriodo);
  var soma = function (l, sinal) { return l.filter(function (x) { return sinal > 0 ? x.valor > 0 : x.valor < 0; }).reduce(function (s, x) { return s + x.valor; }, 0); };
  // faixas: dia ou semana
  var faixas = [], d = ini;
  while (d <= fim) {
    var ate = cfg.escala === 'dia' ? d : (function () { var x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + 6); var s = x.toISOString().slice(0, 10); return s > fim ? fim : s; })();
    faixas.push({ de: d, ate: ate });
    var prox = new Date(ate + 'T00:00:00Z'); prox.setUTCDate(prox.getUTCDate() + 1); d = prox.toISOString().slice(0, 10);
  }
  var acum = saldoInicial;
  faixas.forEach(function (f) {
    var dentro = function (x) { return x.data >= f.de && x.data <= f.ate; };
    f.entradas = soma(rp.filter(dentro), 1); f.saidas = soma(rp.filter(dentro), -1);
    f.prevEntradas = soma(pp.filter(dentro), 1); f.prevSaidas = soma(pp.filter(dentro), -1);
    acum += f.entradas + f.saidas + f.prevEntradas + f.prevSaidas;
    f.saldo = acum;
  });
  var grupos = R.GRUPOS_FLUXO.map(function (g) {
    var l = rp.filter(function (x) { return x.grupo === g[0]; });
    return { nome: g[1], entradas: soma(l, 1), saidas: soma(l, -1) };
  });
  // alerta: saldo projetado negativo nos próximos 90 dias (todas as contas)
  var alerta = null;
  if (cfg.conta === 'todas') {
    var limite = new Date(hoje + 'T00:00:00Z'); limite.setUTCDate(limite.getUTCDate() + 90); limite = limite.toISOString().slice(0, 10);
    var saldoHoje = r.realizado.filter(function (x) { return x.grupo !== 'transferencia' && x.data <= hoje; }).reduce(function (s, x) { return s + x.valor; }, 0);
    var futuros = r.realizado.filter(function (x) { return x.grupo !== 'transferencia' && x.data > hoje; })
      .concat(r.previsto.map(function (x) { return { data: x.data < hoje ? hoje : x.data, valor: x.valor }; }))
      .filter(function (x) { return x.data <= limite; }).sort(function (a, b) { return a.data < b.data ? -1 : 1; });
    var s = saldoHoje;
    if (s < 0) alerta = { data: hoje, saldo: s };
    for (var i = 0; i < futuros.length && !alerta; i++) { s += futuros[i].valor; if (s < 0) alerta = { data: futuros[i].data, saldo: s }; }
  }
  return { ini: ini, fim: fim, saldoInicial: saldoInicial, entradas: soma(rp, 1), saidas: soma(rp, -1), prevEntradas: soma(pp, 1), prevSaidas: soma(pp, -1),
    faixas: faixas, grupos: grupos, alerta: alerta, movimentos: rp.map(function (x) { x.prev = false; return x; }).concat(pp.map(function (x) { return { data: x.data, valor: x.valor, historico: x.historico, prev: true, aguardandoNota: x.aguardandoNota }; }))
      .sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : 0; }) };
};

R.renderFluxo = function () {
  var c = R.calcularFluxo(), cfg = R.fluxoCfg, r = R.fluxoDados;
  var saldoFinal = c.saldoInicial + c.entradas + c.saidas, projetado = saldoFinal + c.prevEntradas + c.prevSaidas;
  var html = '<h1>Financeiro</h1>' + R.segFin('fluxo') +
    '<div class="mes-nav"><button class="btn" data-act="mesFluxo" data-d="-1" aria-label="Mês anterior">‹</button><b>' + R.nomeMes(cfg.mes) + '</b>' +
    '<button class="btn" data-act="mesFluxo" data-d="1" aria-label="Próximo mês">›</button></div>' +
    '<div class="grade2"><label class="campo"><span>Conta</span><select id="fluxoConta"><option value="todas">Todas as contas</option>' +
    R.contasAtivas().map(function (x) { return '<option value="' + R.esc(x.id) + '"' + (x.id === cfg.conta ? ' selected' : '') + '>' + R.esc(x.nome) + '</option>'; }).join('') + '</select></label>' +
    '<label class="campo"><span>Mostrar por</span><select id="fluxoEscala"><option value="semana"' + (cfg.escala === 'semana' ? ' selected' : '') + '>Semana</option><option value="dia"' + (cfg.escala === 'dia' ? ' selected' : '') + '>Dia</option></select></label></div>' +

      '<div class="kpi' + (projetado < 0 ? ' neg' : '') + '"><span>Saldo previsto no fim do mês</span><b>' + R.fmtR(projetado) + '</b></div>' +
      (r.saldoCartao > 0 ? '<div class="kpi"><span>Cartão a pagar (sem data)</span><b>' + R.fmtR(r.saldoCartao) + '</b></div>' : '') + '</div>';
  }
  html += '<div class="card"><h2>' + (cfg.escala === 'dia' ? 'Por dia' : 'Por semana') + '</h2><div class="rolagem"><table class="tabela fluxo"><thead><tr><th>Período</th><th>Entradas</th><th>Saídas</th><th>Saldo</th></tr></thead><tbody>' +
    c.faixas.filter(function (f) { return cfg.escala === 'semana' || f.entradas || f.saidas || f.prevEntradas || f.prevSaidas; }).map(function (f) {
      var prev = f.prevEntradas || f.prevSaidas;

        '<td>' + R.fmtR(Math.abs(f.saidas)) + (f.prevSaidas ? '<br><small class="prev">' + R.fmtR(Math.abs(f.prevSaidas)) + ' prev.</small>' : '') + '</td>' +
        '<td class="' + (f.saldo < 0 ? 'neg' : '') + '">' + R.fmtR(f.saldo) + (prev ? '<br><small class="prev">com previsto</small>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';

  html += '<div class="card"><h2>Movimentação do mês</h2>' + (c.movimentos.length ? '<table class="tabela mov-fluxo"><tbody>' + c.movimentos.map(function (x) {
    return '<tr class="' + (x.prev ? 'linha-prev' : '') + '"><td>' + R.fmtData(x.data).slice(0, 5) + '</td><td>' + R.esc(x.historico) + (x.prev ? ' <small class="prev">previsto' + (x.aguardandoNota ? ', aguardando nota' : '') + '</small>' : '') + '</td>' +
      '<td class="' + (x.valor < 0 ? 'neg' : 'pos') + '">' + (x.valor < 0 ? '− ' : '+ ') + R.fmtR(Math.abs(x.valor)) + '</td></tr>';
  }).join('') + '</tbody></table>' : '<p class="muted">Nada neste mês.</p>') + '</div>' +
    '<p class="muted">O fluxo de caixa usa a <b>data do pagamento</b>. A DRE usa a <b>data da compra ou venda</b>. Por isso os valores do mês podem ser diferentes. ' +
    'O saldo começa em zero na data de início da empresa (' + R.fmtData(R.empresa.dataInicio) + '): registre um aporte com o dinheiro que já existia, se quiser.</p>';
  R.pintar(html);
};

/* Cálculos dos relatórios (DRE, balancete, faturamento e margem por produto).
   Funções puras: recebem os dados e devolvem números em centavos. Usadas pelas telas e pelos testes.
   Partida = [data, contaId, debito, credito, itemId, lancamentoId] */
var Rel = {};

Rel.grupoDre = function (conta) {
  if (/^4\.1\./.test(conta)) return 'receita';
  if (/^4\.9\./.test(conta)) return 'deducoes';
  if (/^4\.2\./.test(conta)) return 'recFin';
  if (/^5\./.test(conta)) return 'custos';
  if (/^6\.2\./.test(conta)) return 'despFin';
  if (/^6\./.test(conta)) return 'despesas';
  return null;
};

Rel.noPeriodo = function (d, de, ate) { return d >= de && d <= ate; };

// DRE (competência): valores positivos aumentam o resultado, negativos diminuem.
Rel.dre = function (partidas, de, ate) {
  var g = { receita: {}, deducoes: {}, custos: {}, despesas: {}, recFin: {}, despFin: {} };
  partidas.forEach(function (p) {
    if (!Rel.noPeriodo(p[0], de, ate)) return;
    var grupo = Rel.grupoDre(p[1]);
    if (!grupo) return;
    g[grupo][p[1]] = (g[grupo][p[1]] || 0) + (p[3] - p[2]);
  });
  var soma = function (o) { return Object.keys(o).reduce(function (s, k) { return s + o[k]; }, 0); };
  var t = {};
  Object.keys(g).forEach(function (k) { t[k] = soma(g[k]); });
  t.receitaLiquida = t.receita + t.deducoes;
  t.lucroBruto = t.receitaLiquida + t.custos;
  t.operacional = t.lucroBruto + t.despesas;
  t.resultado = t.operacional + t.recFin + t.despFin;
  return { contas: g, t: t };
};

// Resultado mês a mês (para o resumo do ano)
Rel.resultadoPorMes = function (partidas, ano) {
  var meses = [];
  for (var m = 1; m <= 12; m++) {
    var ym = ano + '-' + ('0' + m).slice(-2), d = Rel.dre(partidas, ym + '-01', ym + '-31');
    meses.push({ mes: ym, receita: d.t.receitaLiquida, custosDespesas: d.t.custos + d.t.despesas + d.t.despFin + d.t.recFin, resultado: d.t.resultado });
  }
  return meses;
};

// Balancete: saldo anterior, débitos, créditos e saldo atual (positivo = devedor).
Rel.balancete = function (partidas, plano, de, ate) {
  var a = {};
  partidas.forEach(function (p) {
    if (p[0] > ate) return;
    var x = a[p[1]] || (a[p[1]] = { anterior: 0, debito: 0, credito: 0 });
    if (p[0] < de) x.anterior += p[2] - p[3];
    else { x.debito += p[2]; x.credito += p[3]; }
  });
  var linhas = plano.map(function (c) {
    var s = { anterior: 0, debito: 0, credito: 0 };
    Object.keys(a).forEach(function (id) {
      if (id === c.id || (c.tipo === 'S' && id.indexOf(c.id + '.') === 0)) { s.anterior += a[id].anterior; s.debito += a[id].debito; s.credito += a[id].credito; }
    });
    return { id: c.id, nome: c.nome, tipo: c.tipo, anterior: s.anterior, debito: s.debito, credito: s.credito, atual: s.anterior + s.debito - s.credito };
  });
  // contas que existem nas partidas mas não no plano (não deveria acontecer): aparecem no fim
  Object.keys(a).forEach(function (id) {
    if (!plano.some(function (c) { return c.id === id; })) linhas.push({ id: id, nome: '(conta não encontrada no plano)', tipo: 'A', anterior: a[id].anterior, debito: a[id].debito, credito: a[id].credito, atual: a[id].anterior + a[id].debito - a[id].credito });
  });
  var tot = { debito: 0, credito: 0 };
  Object.keys(a).forEach(function (id) { tot.debito += a[id].debito; tot.credito += a[id].credito; });
  return { linhas: linhas, totais: tot };
};

// Divide "total" (centavos) proporcionalmente às bases, fechando exatamente no total (maiores restos).
Rel.ratear = function (total, bases) {
  var ids = Object.keys(bases).filter(function (k) { return bases[k] > 0; });
  var soma = ids.reduce(function (s, k) { return s + bases[k]; }, 0), out = {};
  if (!total || !soma) return { partes: out, distribuido: 0 };
  var sinal = total < 0 ? -1 : 1, abs = Math.abs(total), usado = 0;
  var restos = ids.map(function (k) {
    var exato = abs * bases[k] / soma, inteiro = Math.floor(exato);
    out[k] = inteiro; usado += inteiro;
    return [k, exato - inteiro];
  }).sort(function (x, y) { return y[1] - x[1] || (x[0] < y[0] ? -1 : 1); });
  for (var i = 0; usado < abs; i++, usado++) out[restos[i % restos.length][0]]++;
  ids.forEach(function (k) { out[k] *= sinal; });
  return { partes: out, distribuido: total };
};

// Faturamento e margem por produto.
// itens: cadastro de itens; cfg: { custos, despesas, fatores, areas, metricas }
Rel.produtos = function (dados, plano, itens, de, ate, cfg) {
  cfg = cfg || {};
  var produto = {};
  itens.forEach(function (i) { if (i.tipo === 'produto') produto[i.id] = i; });
  var contasVenda = plano.filter(function (c) { return c.uso === 'receita_vendas'; }).map(function (c) { return c.id; });
  var por = {}, lancsPeriodo = {};
  var P = function (id) { return por[id] || (por[id] = { id: id, receita: 0, qtd: 0, custosDiretos: 0, despesasDiretas: 0 }); };
  var ind = { custos: 0, despesas: 0, deducoes: 0, outrasReceitas: 0, recFin: 0 };
  dados.partidas.forEach(function (p) {
    if (!Rel.noPeriodo(p[0], de, ate)) return;
    var conta = p[1], item = produto[p[4]] ? p[4] : '', v = p[3] - p[2], g = Rel.grupoDre(conta);
    if (!g) return;
    if (g === 'receita') {
      if (item && contasVenda.indexOf(conta) >= 0) { P(item).receita += v; lancsPeriodo[p[5]] = true; }
      else ind.outrasReceitas += v;
    } else if (g === 'deducoes') ind.deducoes += v;
    else if (g === 'recFin') ind.recFin += v;
    else if (g === 'custos') { if (item) P(item).custosDiretos += v; else ind.custos += v; }
    else { if (item) P(item).despesasDiretas += v; else ind.despesas += v; } // despesas e despesas financeiras
  });
  Object.keys(lancsPeriodo).forEach(function (lid) {
    (dados.itensVenda[lid] || []).forEach(function (x) { if (produto[x[0]]) P(x[0]).qtd += x[1]; });
  });
  // produtos que só têm área ou medida informada também entram (para o rateio por área/medida)
  var temBase = function (o) { Object.keys(o || {}).forEach(function (id) { if (produto[id] && o[id] > 0) P(id); }); };
  temBase(cfg.areas);
  (cfg.metricas || []).forEach(function (m) { temBase(m.valores); });

  var ids = Object.keys(por).sort(function (a, b) { return produto[a].nome.localeCompare(produto[b].nome, 'pt-BR'); });
  var unidades = {};
  ids.forEach(function (id) { if (por[id].qtd > 0) unidades[produto[id].unidade] = true; });
  var semFator = ids.some(function (id) { return por[id].qtd > 0 && !(cfg.fatores && cfg.fatores[id] > 0); });
  var avisoUnidades = Object.keys(unidades).length > 1 && semFator;

  var bases = function (criterio) {
    var b = {};
    ids.forEach(function (id) {
      if (criterio === 'receita') b[id] = Math.max(0, por[id].receita);
      else if (criterio === 'quantidade') b[id] = por[id].qtd * ((cfg.fatores && cfg.fatores[id]) || 1);
      else if (criterio === 'area') b[id] = (cfg.areas && cfg.areas[id]) || 0;
      else if (/^m:/.test(criterio)) {
        var m = (cfg.metricas || []).filter(function (x) { return 'm:' + x.id === criterio; })[0];
        b[id] = m && m.valores[id] || 0;
      }
    });
    return b;
  };

  var calcular = function (critCustos, critDespesas) {
    var rCus = Rel.ratear(ind.custos, bases(critCustos)), rDes = Rel.ratear(ind.despesas, bases(critDespesas));
    var porReceita = bases('receita');
    var rDed = Rel.ratear(ind.deducoes, porReceita), rOut = Rel.ratear(ind.outrasReceitas, porReceita);
    var linhas = ids.map(function (id) {
      var x = por[id];
      var l = {
        id: id, nome: produto[id].nome, unidade: produto[id].unidade, qtd: x.qtd, receita: x.receita,
        precoMedio: x.qtd > 0 ? Math.round(x.receita / x.qtd) : 0,
        outrasReceitas: rOut.partes[id] || 0, deducoes: rDed.partes[id] || 0,
        custosDiretos: x.custosDiretos, despesasDiretas: x.despesasDiretas,
        custosRateados: rCus.partes[id] || 0, despesasRateadas: rDes.partes[id] || 0
      };
      l.receitaLiquida = l.receita + l.outrasReceitas + l.deducoes;
      l.resultado = l.receitaLiquida + l.custosDiretos + l.despesasDiretas + l.custosRateados + l.despesasRateadas;
      l.margem = l.receitaLiquida > 0 ? l.resultado / l.receitaLiquida : null;
      return l;
    });
    var naoDistribuido = ind.recFin + (ind.custos - rCus.distribuido) + (ind.despesas - rDes.distribuido) +
      (ind.deducoes - rDed.distribuido) + (ind.outrasReceitas - rOut.distribuido);
    var total = linhas.reduce(function (s, l) { return s + l.resultado; }, 0) + naoDistribuido;
    return { linhas: linhas, naoDistribuido: naoDistribuido, total: total,
      semBase: { custos: ind.custos && !rCus.distribuido, despesas: ind.despesas && !rDes.distribuido } };
  };

  var criterios = ['receita', 'quantidade'];
  if (Object.keys(cfg.areas || {}).some(function (k) { return cfg.areas[k] > 0; })) criterios.push('area');
  (cfg.metricas || []).forEach(function (m) { criterios.push('m:' + m.id); });
  var principal = calcular(cfg.custos || 'receita', cfg.despesas || 'receita');
  var comparacao = criterios.map(function (c) { var r = calcular(c, c); return { criterio: c, margens: r.linhas.map(function (l) { return { id: l.id, resultado: l.resultado, margem: l.margem }; }) }; });
  return { principal: principal, comparacao: comparacao, indiretos: ind, avisoUnidades: avisoUnidades, unidades: Object.keys(unidades) };
};

if (typeof window !== 'undefined') window.Rel = Rel;

/* Fase 4: DRE, faturamento e margem por produto (com rateio), balancete, critérios e fechamento. */
R.relCfg = { aba: 'dre', modo: 'mes', mes: '', ano: '', de: '', ate: '', zeros: false, custos: '', despesas: '' };

R.periodoRel = function () {

R.ABAS_REL = function () {

  if (c.modo === 'mes' || c.modo === 'ano') {
    html += '<div class="mes-nav"><button class="btn" data-act="navRel" data-d="-1" aria-label="Anterior">‹</button><b>' + (c.modo === 'mes' ? R.nomeMes(c.mes) : c.ano) + '</b>' +
      '<button class="btn" data-act="navRel" data-d="1" aria-label="Próximo">›</button></div>';
  } else {
    html += '<div class="grade2"><label class="campo"><span>De</span><input type="date" id="relDe" value="' + R.esc(c.de) + '"></label>' +
      '<label class="campo"><span>Até</span><input type="date" id="relAte" value="' + R.esc(c.ate) + '"></label></div>';
  }

  if (c.aba === 'dre') html += R.htmlDre(per);

  R.pintar(html);

R.acoes.abaRel = function (el) { R.relCfg.aba = el.dataset.aba; R.renderRel(); };
R.acoes.navRel = function (el) {

R.valorDre = function (v) { return '<span class="' + (v < 0 ? 'neg' : '') + '">' + (v < 0 ? '− ' : '') + R.fmtR(Math.abs(v)) + '</span>'; };
R.nomeConta = function (id) { var c = R.porId(R.cad.plano, id); return c ? c.nome : id; };

// ---------- DRE ----------
R.htmlDre = function (per) {
  var d = Rel.dre(R.relDados.partidas, per.de, per.ate), t = d.t;
  var bloco = function (titulo, grupo, sinal) {
    var contas = Object.keys(d.contas[grupo]).filter(function (k) { return d.contas[grupo][k]; }).sort();
    return '<tr class="g"><td>' + titulo + '</td><td>' + R.valorDre(t[grupo]) + '</td></tr>' + contas.map(function (k) {
      return '<tr class="c"><td>' + R.esc(R.nomeConta(k)) + '</td><td>' + R.valorDre(d.contas[grupo][k]) + '</td></tr>';
    }).join('');
  };
  var sub = function (titulo, v, forte) { return '<tr class="s' + (forte ? ' forte' : '') + '"><td>' + titulo + '</td><td>' + R.valorDre(v) + '</td></tr>'; };
  var html = '<div class="card"><table class="dre">' + bloco('Receita bruta', 'receita') + bloco('(−) Deduções', 'deducoes') + sub('= Receita líquida', t.receitaLiquida) +
    bloco('(−) Custos de produção', 'custos') + sub('= Lucro bruto', t.lucroBruto) + bloco('(−) Despesas operacionais', 'despesas') + sub('= Resultado operacional', t.operacional) +
    bloco('(+) Receitas financeiras', 'recFin') + bloco('(−) Despesas financeiras', 'despFin') + sub('= Resultado do período', t.resultado, true) + '</table>' +
    (t.receitaLiquida > 0 ? '<p class="muted">Margem do período: <b>' + (t.resultado / t.receitaLiquida * 100).toFixed(1).replace('.', ',') + '%</b> da receita líquida.</p>' : '') + '</div>';
  if (R.relCfg.modo === 'ano') {
    var meses = Rel.resultadoPorMes(R.relDados.partidas, R.relCfg.ano);
    html += '<div class="card"><h2>Mês a mês</h2><div class="rolagem"><table class="tabela"><thead><tr><th>Mês</th><th>Receita líq.</th><th>Custos e despesas</th><th>Resultado</th></tr></thead><tbody>' +
      meses.map(function (m) { return '<tr><td>' + m.mes.slice(5) + '/' + m.mes.slice(2, 4) + '</td><td>' + R.fmtR(m.receita) + '</td><td>' + R.valorDre(m.custosDespesas) + '</td><td>' + R.valorDre(m.resultado) + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  }
  return html + '<p class="muted nao-imprimir">A DRE usa a <b>data da compra ou venda</b> (venda com nota: data da nota). Investimentos, aportes e retiradas não entram no resultado.</p>';
};

// ---------- Por produto ----------
R.NOMES_CRITERIO = { receita: 'Receita de cada produto', quantidade: 'Quantidade vendida', area: 'Área plantada' };
R.nomeCriterio = function (c) {
  if (R.NOMES_CRITERIO[c]) return R.NOMES_CRITERIO[c];
  var m = ((R.relDados.rateio || {}).metricas || []).filter(function (x) { return 'm:' + x.id === c; })[0];
  return m ? m.nome : c;
};
R.opcoesCriterio = function (atual) {
  var cfg = R.relDados.rateio || {}, l = [['receita', R.NOMES_CRITERIO.receita], ['quantidade', R.NOMES_CRITERIO.quantidade], ['area', R.NOMES_CRITERIO.area]];
  (cfg.metricas || []).forEach(function (m) { l.push(['m:' + m.id, m.nome]); });
  return R.opcoes(l, atual);
};
R.pct = function (m) { return m === null || m === undefined ? '—' : (m * 100).toFixed(1).replace('.', ',') + '%'; };

R.calcProdutos = function (per) {
  var c = R.relCfg, cfg = JSON.parse(JSON.stringify(R.relDados.rateio || {}));
  cfg.custos = c.custos; cfg.despesas = c.despesas;
  return Rel.produtos(R.relDados, R.cad.plano, R.cad.itens, per.de, per.ate, cfg);
};

R.htmlProdutos = function (per) {
  var c = R.relCfg, pr = R.calcProdutos(per), p = pr.principal, ind = pr.indiretos;
  var html = '<div class="card nao-imprimir"><h2>Como dividir os gastos gerais</h2>' +
    '<p class="muted" style="margin-top:0">Gastos lançados como "Geral da propriedade" são divididos entre os produtos pelo critério escolhido. Os demais vão direto ao produto.</p>' +
    '<label class="campo"><span>Custos de produção gerais (' + R.fmtR(Math.abs(ind.custos)) + ') divididos por</span><select id="relCustos">' + R.opcoesCriterio(c.custos) + '</select></label>' +
    '<label class="campo"><span>Despesas gerais, inclusive juros (' + R.fmtR(Math.abs(ind.despesas)) + ') divididas por</span><select id="relDespesas">' + R.opcoesCriterio(c.despesas) + '</select></label>' +
    '<div class="botoes"><button class="btn" data-act="salvarCriterios">Usar como padrão</button><button class="btn" data-act="nav" data-tela="configRateio">Áreas, conversões e medidas</button></div></div>';
  if ((c.custos === 'quantidade' || c.despesas === 'quantidade') && pr.avisoUnidades) {
    html += '<div class="alerta aviso">Os produtos são vendidos em unidades diferentes (' + pr.unidades.join(', ') + '). Dividir pela quantidade só faz sentido com uma conversão para a mesma unidade: informe em <b>Áreas, conversões e medidas</b>.</div>';
  }
  if (p.semBase.custos || p.semBase.despesas) html += '<div class="alerta aviso">O critério escolhido está sem valores (ex.: área não informada). O gasto ficou como "não distribuído".</div>';
  if (!p.linhas.length) return html + '<div class="card"><p class="muted">Nenhuma venda ou gasto por produto neste período.</p></div>';
  html += '<div class="card"><h2>Faturamento por produto</h2><div class="rolagem"><table class="tabela"><thead><tr><th>Produto</th><th>Quantidade</th><th>Receita</th><th>Preço médio</th></tr></thead><tbody>' +
    p.linhas.map(function (l) {
      return '<tr><td>' + R.esc(l.nome) + '</td><td>' + R.fmtNum(l.qtd) + ' ' + R.esc(l.unidade) + '</td><td>' + R.fmtR(l.receita) + '</td><td>' + (l.qtd ? R.fmtR(l.precoMedio) + '/' + R.esc(l.unidade) : '—') + '</td></tr>';
    }).join('') + '<tr class="total"><td>Total</td><td></td><td>' + R.fmtR(p.linhas.reduce(function (s, l) { return s + l.receita; }, 0)) + '</td><td></td></tr></tbody></table></div></div>';
  html += '<h2>Margem por produto</h2>' + p.linhas.map(function (l) {
    var linha = function (rot, v) { return v ? '<tr><td>' + rot + '</td><td>' + R.valorDre(v) + '</td></tr>' : ''; };
    return '<div class="card produto-margem"><div class="lanc-linha"><b>' + R.esc(l.nome) + '</b><b class="' + (l.resultado < 0 ? 'neg' : 'pos') + '">' + R.pct(l.margem) + '</b></div>' +
      '<table class="conf">' + linha('Receita de vendas', l.receita) + linha('Frete e acréscimos cobrados (rateados)', l.outrasReceitas) + linha('Descontos concedidos (rateados)', l.deducoes) +
      '<tr class="forte"><td>Receita líquida</td><td>' + R.valorDre(l.receitaLiquida) + '</td></tr>' +
      linha('Custos diretos', l.custosDiretos) + linha('Despesas diretas', l.despesasDiretas) + linha('Custos gerais rateados', l.custosRateados) + linha('Despesas gerais rateadas', l.despesasRateadas) +
      '<tr class="forte"><td>Resultado do produto</td><td>' + R.valorDre(l.resultado) + '</td></tr></table></div>';
  }).join('');
  html += '<div class="card"><table class="conf">' + (p.naoDistribuido ? '<tr><td>Não distribuído entre produtos (receitas financeiras e gastos sem base)</td><td>' + R.valorDre(p.naoDistribuido) + '</td></tr>' : '') +
    '<tr class="forte"><td>Total (igual ao resultado da DRE)</td><td>' + R.valorDre(p.total) + '</td></tr></table></div>';
  html += '<div class="card"><h2>Comparar critérios</h2><p class="muted" style="margin-top:0">Margem de cada produto se todos os gastos gerais fossem divididos pelo mesmo critério.</p>' +
    '<div class="rolagem"><table class="tabela"><thead><tr><th>Produto</th>' + pr.comparacao.map(function (x) { return '<th>' + R.esc(R.nomeCriterio(x.criterio)) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    p.linhas.map(function (l, i) { return '<tr><td>' + R.esc(l.nome) + '</td>' + pr.comparacao.map(function (x) { return '<td>' + R.pct(x.margens[i].margem) + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table></div></div>';
  return html;
};

R.acoes.salvarCriterios = function () {
  var cfg = JSON.parse(JSON.stringify(R.relDados.rateio || {}));

  return R.exec('salvarRateio', { empresaId: R.empresa.id, rateio: cfg }).then(function (r) { R.relDados.rateio = r.rateio; R.toast('Critérios salvos como padrão.'); });

// ---------- Exportar e imprimir ----------
R.acoes.imprimirRel = function () { window.print(); };

R.csvNum = function (c) { return (c / 100).toFixed(2).replace('.', ','); };
R.baixarCsv = function (nome, linhas) {
  var txt = '\ufeff' + linhas.map(function (l) { return l.map(function (v) { v = String(v === undefined || v === null ? '' : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
};

R.acoes.exportarRel = function () {
  var c = R.relCfg, per = R.periodoRel(), L = [[R.empresa.nome], [per.nome], []], arq = 'sistema-rural-' + c.aba + '-' + per.de + '-a-' + per.ate + '.csv';
  if (c.aba === 'dre') {
    var d = Rel.dre(R.relDados.partidas, per.de, per.ate), t = d.t;
    var bloco = function (tit, g) { L.push([tit, R.csvNum(t[g])]); Object.keys(d.contas[g]).sort().forEach(function (k) { if (d.contas[g][k]) L.push(['   ' + R.nomeConta(k), R.csvNum(d.contas[g][k])]); }); };
    L.push(['Linha', 'Valor (R$)']);
    bloco('Receita bruta', 'receita'); bloco('(-) Deduções', 'deducoes'); L.push(['= Receita líquida', R.csvNum(t.receitaLiquida)]);
    bloco('(-) Custos de produção', 'custos'); L.push(['= Lucro bruto', R.csvNum(t.lucroBruto)]);
    bloco('(-) Despesas operacionais', 'despesas'); L.push(['= Resultado operacional', R.csvNum(t.operacional)]);
    bloco('(+) Receitas financeiras', 'recFin'); bloco('(-) Despesas financeiras', 'despFin'); L.push(['= Resultado do período', R.csvNum(t.resultado)]);
  } else if (c.aba === 'produtos') {
    var p = R.calcProdutos(per).principal;
    L.push(['Custos gerais divididos por', R.nomeCriterio(c.custos)], ['Despesas gerais divididas por', R.nomeCriterio(c.despesas)], []);
    L.push(['Produto', 'Unidade', 'Quantidade', 'Receita', 'Preço médio', 'Frete/acréscimos rateados', 'Descontos rateados', 'Receita líquida', 'Custos diretos', 'Despesas diretas', 'Custos rateados', 'Despesas rateadas', 'Resultado', 'Margem %']);
    p.linhas.forEach(function (l) {
      L.push([l.nome, l.unidade, String(l.qtd).replace('.', ','), R.csvNum(l.receita), l.qtd ? R.csvNum(l.precoMedio) : '', R.csvNum(l.outrasReceitas), R.csvNum(l.deducoes), R.csvNum(l.receitaLiquida),
        R.csvNum(l.custosDiretos), R.csvNum(l.despesasDiretas), R.csvNum(l.custosRateados), R.csvNum(l.despesasRateadas), R.csvNum(l.resultado), l.margem === null ? '' : (l.margem * 100).toFixed(1).replace('.', ',')]);
    });
    L.push(['Não distribuído', '', '', '', '', '', '', '', '', '', '', '', R.csvNum(p.naoDistribuido)], ['Total (resultado da DRE)', '', '', '', '', '', '', '', '', '', '', '', R.csvNum(p.total)]);
  } else {
    var b = Rel.balancete(R.relDados.partidas, R.cad.plano, per.de, per.ate);
    L.push(['Código', 'Conta', 'Saldo anterior', 'Débitos', 'Créditos', 'Saldo atual']);
    b.linhas.forEach(function (l) { if (c.zeros || l.anterior || l.debito || l.credito) L.push([l.id, l.nome, R.csvNum(l.anterior), R.csvNum(l.debito), R.csvNum(l.credito), R.csvNum(l.atual)]); });
    L.push(['', 'Totais', '', R.csvNum(b.totais.debito), R.csvNum(b.totais.credito), '']);
  }
  R.baixarCsv(arq, L);
};

// ---------- Áreas, conversões e medidas ----------
R.telas.configRateio = function () {
  if (!R.relDados) { R.ir('relatorios'); return; }
  var cfg = R.relDados.rateio || {}, prods = R.itensAtivos('produto');
  R.cfgEdit = JSON.parse(JSON.stringify({ fatores: cfg.fatores || {}, areas: cfg.areas || {}, metricas: cfg.metricas || [] }));
  R.renderConfigRateio(prods);
};

R.renderConfigRateio = function (prods) {
  prods = prods || R.itensAtivos('produto');
  var e = R.cfgEdit, num = function (v) { return v || v === 0 ? String(v).replace('.', ',') : ''; };
  var html = '<h1>Áreas, conversões e medidas</h1><p class="muted">Usadas para dividir os gastos gerais entre os produtos.</p>';
  if (!prods.length) { R.pintar(html + '<div class="card"><p>Cadastre os produtos que você vende primeiro.</p></div>'); return; }
  html += '<form class="card" data-form="configRateio" novalidate><div class="msg" hidden></div>' +
    '<h2>Área plantada (hectares)</h2>' + prods.map(function (p) { return '<label class="campo"><span>' + R.esc(p.nome) + '</span><input inputmode="decimal" data-cfg="areas" data-id="' + R.esc(p.id) + '" value="' + num(e.areas[p.id]) + '" placeholder="0"></label>'; }).join('') +
    '<h2>Conversão de quantidade</h2><p class="muted" style="margin-top:0">Para comparar produtos vendidos em unidades diferentes. Ex.: 1 maço de alface = 0,3 kg.</p>' +
    prods.map(function (p) { return '<label class="campo"><span>1 ' + R.esc(R.rotulo(R.UNIDADES, p.unidade).toLowerCase()) + ' de ' + R.esc(p.nome) + ' = quantos kg (ou unidade comum)?</span><input inputmode="decimal" data-cfg="fatores" data-id="' + R.esc(p.id) + '" value="' + num(e.fatores[p.id]) + '" placeholder="1"></label>'; }).join('') +
    '<h2>Medidas próprias</h2><p class="muted" style="margin-top:0">Ex.: horas de trabalho, caixas colhidas.</p>' +
    e.metricas.map(function (m, i) {
      return '<div class="linha-item"><div class="linha-topo"><input data-met-nome="' + i + '" value="' + R.esc(m.nome) + '" maxlength="40" placeholder="Nome da medida"><button type="button" class="btn link" data-act="removerMetrica" data-i="' + i + '">Remover</button></div>' +
        prods.map(function (p) { return '<label class="campo"><span>' + R.esc(p.nome) + '</span><input inputmode="decimal" data-met="' + i + '" data-id="' + R.esc(p.id) + '" value="' + num(m.valores[p.id]) + '" placeholder="0"></label>'; }).join('') + '</div>';
    }).join('') + '<div class="botoes"><button type="button" class="btn" data-act="addMetrica">+ Nova medida</button></div>' +
    '<div class="botoes"><button type="button" class="btn" data-act="nav" data-tela="relatorios">Cancelar</button><button class="btn primario">Salvar</button></div></form>';
  R.pintar(html);
};

R.lerFormRateio = function () {
  var e = R.cfgEdit;
  document.querySelectorAll('[data-cfg]').forEach(function (el) { var n = R.parseNum(el.value); if (el.value.trim() === '') delete e[el.dataset.cfg][el.dataset.id]; else e[el.dataset.cfg][el.dataset.id] = isFinite(n) ? n : el.value; });
  document.querySelectorAll('[data-met-nome]').forEach(function (el) { e.metricas[Number(el.dataset.metNome)].nome = el.value; });
  document.querySelectorAll('[data-met]').forEach(function (el) { var m = e.metricas[Number(el.dataset.met)], n = R.parseNum(el.value); if (el.value.trim() === '') delete m.valores[el.dataset.id]; else m.valores[el.dataset.id] = isFinite(n) ? n : el.value; });
};
R.acoes.addMetrica = function () { R.lerFormRateio(); R.cfgEdit.metricas.push({ id: '', nome: '', valores: {} }); R.renderConfigRateio(); };
R.acoes.removerMetrica = function (el) { R.lerFormRateio(); R.cfgEdit.metricas.splice(Number(el.dataset.i), 1); R.renderConfigRateio(); };

R.forms.configRateio = function () {
  R.lerFormRateio();
  var cfg = { custos: R.relCfg.custos || 'receita', despesas: R.relCfg.despesas || 'receita', fatores: R.cfgEdit.fatores, areas: R.cfgEdit.areas, metricas: R.cfgEdit.metricas };
  var ids = cfg.metricas.map(function (m) { return 'm:' + m.id; });
  if (/^m:/.test(cfg.custos) && ids.indexOf(cfg.custos) < 0) cfg.custos = 'receita';
  if (/^m:/.test(cfg.despesas) && ids.indexOf(cfg.despesas) < 0) cfg.despesas = 'receita';
  return R.exec('salvarRateio', { empresaId: R.empresa.id, rateio: cfg }).then(function (r) {
    R.relDados.rateio = r.rateio;
    R.relCfg.custos = r.rateio.custos; R.relCfg.despesas = r.rateio.despesas;
    R.toast('Salvo.');
    R.relCfg.aba = 'produtos';
    R.ir('relatorios');
  });
};

// ---------- Fechamento de período (contador) ----------

    '<form class="card" data-form="fechamento" novalidate><div class="msg" hidden></div><label class="campo"><span>Fechar até o mês</span><input type="month" name="ate" value="' + R.esc(f || sug) + '" min="' + R.esc(R.empresa.dataInicio.slice(0, 7)) + '" max="' + R.hoje().slice(0, 7) + '"></label>' +

R.forms.fechamento = function (d) {

R.acoes.reabrirTudo = function () {

};

// Tela -> item da barra de navegação que fica destacado
var TELAS_COM_NAV_R = {
  inicio: 'inicio', lancamentos: 'lancamentos', detalheLanc: 'lancamentos', lancar: 'lancamentos',
  financeiro: 'financeiro', formBaixa: 'financeiro', formMovimento: 'financeiro',
  relatorios: 'relatorios', configRateio: 'relatorios',
  notas: 'mais', espelho: 'mais', formAprovacao: 'mais', formRecusa: 'mais', formNota: 'mais', formEmitente: 'mais',
  cadastros: 'mais', formItem: 'mais', formCliente: 'mais', formFornecedor: 'mais', formContaFin: 'mais',
  mais: 'mais', escritorio: 'mais', plano: 'mais', formConta: 'mais', empresas: 'mais', formEmpresa: 'mais', fechamento: 'mais',
  usuarios: 'mais', formUsuario: 'mais', senhaGerada: 'mais', conta: 'mais', contaContador: 'mais', velocidade: 'mais', escolher: '', semEmpresa: ''
};

R.atualizarMoldura = function () {
  var logado = !!R.usuario && !R.usuario.trocarSenha;
  var nav = R.el('nav'), secao = TELAS_COM_NAV_R[R.tela];
  R.el('topo').hidden = !logado;
  nav.hidden = !logado;
  var troca = R.el('trocaEmpresa');
  troca.hidden = !logado || !R.empresas.length || (R.empresa && R.empresas.length < 2) || R.tela === 'escolher';
  troca.textContent = R.empresa ? 'Trocar empresa' : 'Abrir empresa';
  R.el('marca').textContent = logado && R.empresa ? R.empresa.nome : 'Sistema Rural';
  if (!logado) return;
  var itens = [];
  if (R.empresa) itens.push(['inicio', 'Início'], ['lancamentos', 'Lançamentos'], ['financeiro', 'Financeiro'], ['relatorios', 'Relatórios']);
  itens.push(['mais', 'Mais']); // cadastros, notas, conta e ferramentas do escritório
  nav.innerHTML = itens.map(function (i) {
    return '<button data-act="nav" data-tela="' + i[0] + '"' + (secao === i[0] ? ' class="ativo" aria-current="page"' : '') + '>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONES_R[i[0]] + '</svg>' + i[1] + '</button>';
  }).join('');
};

R.acoes.nav = function (el) {
  if (R.tela === 'lancar' && R.L && !confirm('Sair do lançamento? O que já foi digitado fica guardado como rascunho.')) return;
  R.ir(el.dataset.tela);
};

// Se o site tiver versão nova, recarrega com outro endereço (?v=...) para o navegador não usar a cópia guardada.
R.conferirVersao = function () {
  if (!window.R_VERSAO || !window.fetch) return Promise.resolve(false);
  return fetch('versao.json?t=' + Date.now(), { cache: 'no-store', credentials: 'omit' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (v) {
      if (v.versao && v.versao !== window.R_VERSAO && location.search.indexOf('v=' + v.versao) < 0) {
        location.replace(location.pathname + '?v=' + v.versao);
        return true;
      }
      return false;
    })
    .catch(function () { return false; });
};

// Quem deixa o app aberto no celular por dias também recebe a versão nova ao voltar para ele.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && R.tela !== 'lancar') R.conferirVersao();
});

R.iniciar = function () {
  R.conferirVersao().then(function (recarregando) { if (!recarregando) R.iniciarSessao(); });
};

R.iniciarSessao = function () {
  R.token = R.ler('rural_sessao');
  if (!R.token) { R.ir('login'); return; }
  R.chamar('eu').then(R.entrar).catch(function (e) {
    if (e.sessaoExpirada) { R.encerrar(); return; }
    R.token = '';
    R.ir('login');
    R.toast(e.message, true);
  });
};

</script>
<script>R.iniciar();</script>
</body>
